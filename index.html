<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mateusz | 3D Projects</title>
  <!-- Import the model-viewer component -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1620;
      --muted:#94a3b8;
      --accent:#7dd3fc;
      --card-border:#24303a;
    }
    *{box-sizing:border-box}
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: linear-gradient(180deg,var(--bg), #071017 60%); color: #c9d1d9; padding: 2rem; margin:0; }
    .wrap{max-width:1200px;margin:0 auto;height:100vh}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
    header h1{margin:0;font-size:1.25rem;letter-spacing:0.4px}
    header p{margin:0;color:var(--muted);font-size:0.9rem}
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
    .card { background: linear-gradient(180deg,var(--panel), #0c1318); border-radius: 12px; padding: 0.75rem; border: 1px solid var(--card-border); box-shadow: 0 6px 18px rgba(2,6,11,0.6); transition:transform .18s ease, box-shadow .18s ease; overflow:hidden }
    .card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(2,6,11,0.8)}
    .viewer{width:100%;height:320px;border-radius:8px;overflow:hidden;background:#071017}
    model-viewer{width:100%;height:100%;display:block;background:transparent}
    .meta{padding:0.6rem 0 0;display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
    .meta .info{flex:1}
    .meta h3{margin:0;font-size:1rem}
    .meta p{margin:0;color:var(--muted);font-size:0.85rem}
    .actions{display:flex;gap:0.5rem}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--accent);padding:6px 10px;border-radius:8px;font-size:0.85rem;text-decoration:none}
    .btn.ghost{color:var(--muted);border-color:transparent}
    footer{margin-top:1.5rem;color:var(--muted);font-size:0.85rem}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Mateusz - 3D Projects</h1>
        <p>Interactive previews, click and drag to inspect the models</p>
      </div>

    </header>

    <main>
      <div class="grid">

        <!-- Model 1 -->
        <div class="card">
          <div class="viewer">
            <model-viewer src="brick.glb" alt="Custom Lego Brick" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="auto" loading="lazy"></model-viewer>
          </div>
          <div class="meta">
            <div class="info">
              <h3>Custom 'LEGO' Brick</h3>
              <p>3D print of a custom 'LEGO' brick.</p>
            </div>
            <div class="actions">
              <a class="btn ghost" href="brick.glb">Open</a>
            </div>
          </div>
        </div>

        <!-- Model 2 -->
        <div class="card">
          <div class="viewer">
            <model-viewer src="meeting_table.glb" alt="3D Meeting Plate" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="auto" loading="lazy"></model-viewer>
          </div>
          <div class="meta">
            <div class="info">
              <h3>3D Meeting Plate</h3>
              <p>3D print used for hosting meetings.</p>
            </div>
            <div class="actions">
              <a class="btn ghost" href="meeting_table.glb">Open</a>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</body>
</html>
